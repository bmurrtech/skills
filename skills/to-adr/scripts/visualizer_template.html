<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADR at a glance</title>
<!--
  Generated by skills/to-adr/scripts/build_catalog.py.
  Styling aligned with visual-explainer: CSS variables, light+dark, atmosphere,
  staggered motion, reduced-motion respect. Not indigo/slate/Inter defaults.
-->
<style>
  :root {
    /* System / local stacks only — no remote font fetches. */
    --font-display: Georgia, "Times New Roman", "Iowan Old Style", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --bg: #f7f3eb;
    --surface: #fffdf8;
    --surface2: #efe8dc;
    --surface-elevated: #ffffff;
    --rail: #f0e9dc;
    --border: rgba(40, 28, 12, 0.1);
    --border-bright: rgba(40, 28, 12, 0.18);
    --text: #1c150e;
    --text-dim: #7a6b58;
    --accent: #b45309;
    --accent-dim: rgba(180, 83, 9, 0.1);
    --node-a: #0f766e;
    --node-a-dim: rgba(15, 118, 110, 0.1);
    --node-b: #b45309;
    --node-b-dim: rgba(180, 83, 9, 0.1);
    --draft: #a16207;
    --stable: #15803d;
    --deprecated: #78716c;
    --draft-dim: rgba(161, 98, 7, 0.12);
    --stable-dim: rgba(21, 128, 61, 0.12);
    --deprecated-dim: rgba(120, 113, 108, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14110e;
      --surface: #1c1814;
      --surface2: #262019;
      --surface-elevated: #2e261e;
      --rail: #1a1612;
      --border: rgba(255, 236, 210, 0.08);
      --border-bright: rgba(255, 236, 210, 0.16);
      --text: #f5ecdf;
      --text-dim: #a89880;
      --accent: #fb923c;
      --accent-dim: rgba(251, 146, 60, 0.14);
      --node-a: #5eead4;
      --node-a-dim: rgba(94, 234, 212, 0.12);
      --node-b: #fb923c;
      --node-b-dim: rgba(251, 146, 60, 0.12);
      --draft: #fbbf24;
      --stable: #4ade80;
      --deprecated: #a8a29e;
      --draft-dim: rgba(251, 191, 36, 0.14);
      --stable-dim: rgba(74, 222, 128, 0.12);
      --deprecated-dim: rgba(168, 162, 158, 0.12);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at 12% 0%, var(--accent-dim) 0%, transparent 48%),
      radial-gradient(ellipse at 88% 100%, var(--node-a-dim) 0%, transparent 42%);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate {
    animation: fadeUp 0.35s ease-out both;
    animation-delay: calc(var(--i, 0) * 0.04s);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  header {
    display: flex;
    gap: 20px;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface-elevated), transparent);
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    text-wrap: balance;
  }

  .meta, .muted { color: var(--text-dim); font-size: 0.92rem; }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: end;
    flex-wrap: wrap;
  }

  label.field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  input, select, button {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }

  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type=search] { width: min(280px, 70vw); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    cursor: pointer;
    background: var(--surface2);
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .chip.on {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .layout {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(280px, 38%) minmax(0, 62%);
    min-height: 0;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; overflow: auto; }
  }

  .rail {
    border-right: 1px solid var(--border);
    overflow: auto;
    padding: 18px 18px 32px;
    background: color-mix(in srgb, var(--rail) 88%, transparent);
  }

  .document-wrap {
    overflow: auto;
    padding: 28px 32px 56px;
  }

  .month {
    margin: 18px 0 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .decision {
    display: grid;
    grid-template-columns: 88px 1fr;
    gap: 12px;
    padding: 12px 10px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    background: var(--surface);
    margin-bottom: 8px;
  }

  .decision:hover {
    border-color: var(--border-bright);
    background: var(--surface-elevated);
  }

  .decision.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
    box-shadow: 0 0 0 1px var(--accent-dim);
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .pill {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .draft { color: var(--draft); background: var(--draft-dim); }
  .stable { color: var(--stable); background: var(--stable-dim); }
  .deprecated { color: var(--deprecated); background: var(--deprecated-dim); }

  details.connections {
    margin-top: 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px 16px;
    background: var(--surface);
  }

  details.connections > summary {
    cursor: pointer;
    padding: 6px 0;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  #graph { width: 100%; min-height: 220px; }
  .edge { stroke: var(--border-bright); stroke-width: 1.5; }
  .node { fill: var(--surface-elevated); stroke: var(--accent); stroke-width: 2; }
  .node-ext { stroke: var(--node-a); }
  .node-label { fill: var(--text); font-size: 11px; font-family: var(--font-mono); }

  .empty { color: var(--text-dim); font-style: italic; }

  #document h1 {
    font-size: clamp(1.9rem, 4vw, 2.8rem);
    margin: 0 0 10px;
  }

  #document h2 {
    margin: 1.5em 0 0.45em;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  #document h3 {
    margin: 1.15em 0 0.35em;
    font-size: 1rem;
    font-weight: 600;
  }

  #document .meta-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin: 8px 0 20px;
  }

  #document .history {
    margin: 18px 0;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }

  #document .history li { margin: 0.25rem 0; font-family: var(--font-mono); font-size: 12px; }

  #document .nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  #document ul { padding-left: 22px; margin: 0.4em 0; }
  #document p { margin: 0.55em 0; max-width: 68ch; }
  #document code {
    font-family: var(--font-mono);
    font-size: 0.88em;
    background: var(--surface2);
    padding: 0.1em 0.35em;
    border-radius: 4px;
  }

  .synopsis {
    margin: 0 0 18px;
    padding: 14px 16px;
    border-left: 3px solid var(--accent);
    background: var(--accent-dim);
    border-radius: 0 10px 10px 0;
    color: var(--text-dim);
  }

  .lineage {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px 10px 14px;
  }

  .lineage .lane-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .lineage-card {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    padding: 10px 12px;
    cursor: pointer;
    color: inherit;
    font: inherit;
  }

  .lineage-card:hover { border-color: var(--border-bright); }
  .lineage-card.current {
    border-color: var(--accent);
    background: var(--accent-dim);
    cursor: default;
  }
  .lineage-card .edge-label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .lineage-review {
    margin: 12px 0 18px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    font-size: 13px;
  }

  .lineage-review li { margin: 0.2rem 0; }

  .nav button {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  .nav button:hover { border-color: var(--border-bright); }
  .nav button:disabled { opacity: 0.4; cursor: default; }

  .pred-chooser {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">Decision log · at a glance</div>
      <h1>Architecture decisions</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="toolbar">
      <label class="field">Search<input id="search" type="search" placeholder="title, rationale, path…"></label>
      <div id="filters">
        <div class="chips" role="group" aria-label="OKF status">
          <button type="button" class="chip on" data-status="">All</button>
          <button type="button" class="chip" data-status="draft" title="Proposed / draft">draft</button>
          <button type="button" class="chip" data-status="stable" title="Accepted / stable">stable</button>
          <button type="button" class="chip" data-status="deprecated" title="Deprecated / superseded">deprecated</button>
        </div>
        <label class="field">Month<select id="month-filter"><option value="">All</option></select></label>
        <label class="field">NNNN<input id="number-filter" inputmode="numeric" placeholder="0002" size="6"></label>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="rail">
      <div id="timeline"></div>
      <details class="connections" open>
        <summary>Lineage</summary>
        <div id="lineage" class="lineage" aria-label="Decision lineage"></div>
      </details>
    </aside>
    <main class="document-wrap"><article id="document"></article></main>
  </div>
<script>
const catalog = __CATALOG_JSON__;
const decisions = catalog.decisions || [];
const edges = catalog.lineage_edges || [];
const issues = catalog.issues || [];
const bySlug = Object.fromEntries(decisions.map(d => [d.slug, d]));
const local = p => String(p || "").replace(/^\//, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

/** Return stack for Next — not “the successor.” */
let returnStack = [];
let suppressHashClear = false;
let selectedSlug = null;

document.querySelector("#meta").textContent =
  `${decisions.length} decisions · schema ${catalog.schema_version || "?"} · generated ${catalog.generated?.at || ""}`;

const months = [...new Set(decisions.map(d => d.month).filter(Boolean))];
const monthSelect = document.querySelector("#month-filter");
months.forEach(month => {
  const opt = document.createElement("option");
  opt.value = month;
  opt.textContent = month;
  monthSelect.append(opt);
});

function slugFromHash() {
  return decodeURIComponent((location.hash || "").replace(/^#\/?/, "").replace(/\.md$/i, ""));
}

function successorLabel(successor) {
  const raw = (successor.status_raw || "").toLowerCase();
  if (raw === "proposed" || raw === "draft" || successor.status === "draft") return "Proposed successor";
  if (successor.status === "stable") return "Successor";
  return "Provisional successor";
}

function lineageSlugs(d) {
  const lin = d.lineage || {};
  return new Set([...(lin.predecessors || []), ...(lin.successors || []), d.slug]);
}

function referenceLinks(d) {
  const skip = lineageSlugs(d);
  const skipPaths = new Set(
    [...skip].flatMap(slug => {
      const hit = bySlug[slug];
      return hit ? [hit.path, "/" + (hit.slug + ".md"), hit.slug + ".md"] : [slug + ".md", "/" + slug + ".md"];
    })
  );
  return (d.related || []).filter(path => {
    const stem = String(path).replace(/^\//, "").replace(/\.md$/i, "");
    if (skip.has(stem)) return false;
    if (skipPaths.has(path) || skipPaths.has(local(path))) return false;
    return true;
  });
}

function md(src, skipTitle) {
  let text = String(src ?? "").replace(/\r\n/g, "\n").replace(/<!--[\s\S]*?-->/g, "");
  if (skipTitle) text = text.replace(/^#[^#\n].*\n+/, "");
  const lines = text.split("\n");
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push("</ul>"); list = null; } };
  const safeHref = href => {
    const raw = String(href || "").trim();
    if (/^(https?:|mailto:|#|\/|\.\/|\.\.\/)/i.test(raw)) return esc(raw);
    if (/^[^:]+\.md(?:#.*)?$/i.test(raw)) return esc(raw);
    return "#";
  };
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) =>
      `<a href="${safeHref(href)}">${label}</a>`);
  for (const line of lines) {
    const heading = line.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      close();
      out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
      continue;
    }
    const item = line.match(/^[-*]\s+(.+)$/);
    if (item) {
      if (!list) { out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(item[1])}</li>`);
      continue;
    }
    if (!line.trim()) { close(); continue; }
    close();
    out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

function filtered() {
  const terms = document.querySelector("#search").value.toLowerCase().split(/\s+/).filter(Boolean);
  const status = document.querySelector(".chip.on")?.dataset.status || "";
  const month = document.querySelector("#month-filter").value;
  const nnnn = document.querySelector("#number-filter").value.trim();
  return decisions.filter(d => {
    if (status && d.status !== status) return false;
    if (month && d.month !== month) return false;
    if (nnnn && d.number !== nnnn && d.number !== nnnn.padStart(4, "0")) return false;
    return terms.every(t => (d.search_text || "").includes(t));
  });
}

function cardHtml(d, { current = false, edgeLabel = "" } = {}) {
  return `<button type="button" class="lineage-card${current ? " current" : ""}" data-slug="${esc(d.slug)}"${current ? " disabled" : ""}>` +
    `<strong>${esc(d.number ? d.number + " · " : "")}${esc(d.title)}</strong>` +
    `<span class="pill ${esc(d.status)}" style="margin-left:8px">${esc(d.status_raw || d.status)}</span>` +
    (edgeLabel ? `<span class="edge-label">${esc(edgeLabel)}</span>` : "") +
    `</button>`;
}

function renderLineage(d) {
  const pane = document.querySelector("#lineage");
  if (!d) {
    pane.innerHTML = `<p class="empty">Select a decision.</p>`;
    return;
  }
  const lin = d.lineage || {};
  const preds = (lin.predecessors || []).map(s => bySlug[s]).filter(Boolean);
  const succs = (lin.successors || []).map(s => bySlug[s]).filter(Boolean);
  let html = "";
  html += `<div class="lane-label">Predecessors</div>`;
  html += preds.length
    ? preds.map(p => cardHtml(p, { edgeLabel: "Predecessor" })).join("")
    : `<p class="empty">None</p>`;
  html += `<div class="lane-label">Current · depth ${esc(lin.depth ?? 0)} · origin ${(lin.roots || []).map(esc).join(", ") || "—"}</div>`;
  html += cardHtml(d, { current: true });
  html += `<div class="lane-label">${succs.length > 1 ? "Several later decisions" : "Successors"}</div>`;
  html += succs.length
    ? succs.map(s => cardHtml(s, { edgeLabel: successorLabel(s) })).join("")
    : `<p class="empty">None</p>`;
  pane.innerHTML = html;
  pane.querySelectorAll(".lineage-card:not(.current)").forEach(el =>
    el.addEventListener("click", () => openDecision(el.dataset.slug, { clearStack: true, writeHash: true })));
}

function renderTimeline(rows, selected) {
  const timeline = document.querySelector("#timeline");
  if (!rows.length) {
    timeline.innerHTML = `<p class="empty">No matching decisions.</p>`;
    return;
  }
  let last = "";
  let html = "";
  rows.forEach((d, i) => {
    const month = d.month || "Undated";
    if (month !== last) {
      html += `<div class="month">${esc(month)}</div>`;
      last = month;
    }
    html += `<article class="decision animate${selected && selected.slug === d.slug ? " selected" : ""}" style="--i:${i}" data-slug="${esc(d.slug)}"><div><span class="pill ${esc(d.status)}">${esc(d.status_raw || d.status)}</span><div class="meta">${esc(d.date || "undated")}</div></div><div><strong>${esc(d.number ? `${d.number} · ` : "")}${esc(d.title)}</strong></div></article>`;
  });
  timeline.innerHTML = html;
  timeline.querySelectorAll(".decision").forEach(el =>
    el.addEventListener("click", () => openDecision(el.dataset.slug, { clearStack: true, writeHash: true })));
}

function renderDocument(d) {
  const pane = document.querySelector("#document");
  if (!d) {
    pane.innerHTML = `<p class="empty">Select a decision from the timeline.</p>`;
    return;
  }
  const lin = d.lineage || {};
  const preds = (lin.predecessors || []).map(s => bySlug[s]).filter(Boolean);
  const history = (d.history || []).map(h =>
    `<li><code>${esc(h.hash)}</code> ${esc((h.date || "").slice(0, 10))} · ${esc(h.author)} — ${esc(h.subject)}</li>`
  ).join("") || `<li class="empty">No git history in this catalog rebuild.</li>`;
  const last = d.history && d.history[0];
  const synopsis = d.synopsis
    ? `<p class="synopsis">${esc(d.synopsis)}</p>`
    : "";
  const myIssues = issues.filter(issue => (issue.decisions || []).includes(d.slug));
  const review = myIssues.length
    ? `<div class="lineage-review animate" style="--i:3"><div class="eyebrow">Lineage review</div><ul>${
        myIssues.map(i => `<li><code>${esc(i.code)}</code> ${esc(i.message)}</li>`).join("")
      }</ul></div>`
    : "";
  const refs = referenceLinks(d);
  const refBlock = refs.length
    ? `<div class="history animate" style="--i:4"><div class="eyebrow">References</div><ul>${
        refs.map(r => `<li><a href="${esc(local(r))}">${esc(local(r))}</a></li>`).join("")
      }</ul></div>`
    : "";

  let prevControl = `<span></span>`;
  if (preds.length === 1) {
    prevControl = `<button type="button" id="nav-prev">← Previous · ${esc(preds[0].number || "")} ${esc(preds[0].title)}</button>`;
  } else if (preds.length > 1) {
    prevControl = `<div><button type="button" id="nav-prev-menu">← Previous…</button>` +
      `<div class="pred-chooser" id="pred-chooser" hidden>${
        preds.map(p => `<button type="button" data-pred="${esc(p.slug)}">${esc(p.number || "")} ${esc(p.title)}</button>`).join("")
      }</div></div>`;
  }

  const nextEnabled = returnStack.length > 0;
  const nextControl = `<button type="button" id="nav-next"${nextEnabled ? "" : " disabled"}>Next →</button>`;

  pane.innerHTML =
    `<div class="eyebrow animate" style="--i:0">${esc(d.slug)}</div>` +
    `<h1 class="animate" style="--i:1">${esc(d.title)}</h1>` +
    `<div class="meta-row animate" style="--i:2">` +
      `<span class="pill ${esc(d.status)}">${esc(d.status_raw || d.status)}</span>` +
      `<span class="meta">${esc(d.date || "undated")}</span>` +
      (last ? `<span class="meta">git ${esc((last.date || "").slice(0, 10))} · ${esc(last.hash)}</span>` : "") +
      `<a href="${esc(local(d.path))}">Open .md</a>` +
    `</div>` +
    synopsis +
    review +
    refBlock +
    `<div class="history animate" style="--i:5"><div class="eyebrow">Git history (not lineage)</div><ul>${history}</ul></div>` +
    `<div class="animate" style="--i:6">${md(d.markdown || "", true)}</div>` +
    `<div class="nav animate" style="--i:7">${prevControl}${nextControl}</div>`;

  const prevBtn = document.getElementById("nav-prev");
  if (prevBtn) prevBtn.addEventListener("click", () => goPrevious(preds[0].slug));
  const prevMenu = document.getElementById("nav-prev-menu");
  if (prevMenu) {
    prevMenu.addEventListener("click", () => {
      const chooser = document.getElementById("pred-chooser");
      if (chooser) chooser.hidden = !chooser.hidden;
    });
    document.querySelectorAll("#pred-chooser [data-pred]").forEach(btn =>
      btn.addEventListener("click", () => goPrevious(btn.dataset.pred)));
  }
  const nextBtn = document.getElementById("nav-next");
  if (nextBtn) nextBtn.addEventListener("click", goNext);
}

function goPrevious(predSlug) {
  if (selectedSlug) returnStack.push(selectedSlug);
  openDecision(predSlug, { clearStack: false, writeHash: true });
}

function goNext() {
  const slug = returnStack.pop();
  if (!slug) return;
  openDecision(slug, { clearStack: false, writeHash: true });
}

function openDecision(slug, { clearStack = false, writeHash = false } = {}) {
  if (clearStack) returnStack = [];
  const rows = filtered();
  const requested = decisions.find(d => d.slug === slug) || rows.find(d => d.slug === slug);
  const hit = requested || rows[0] || null;
  selectedSlug = hit ? hit.slug : null;
  if (hit && writeHash) {
    const next = "#" + hit.slug;
    if (location.hash !== next) {
      suppressHashClear = true;
      location.hash = next;
    }
  }
  renderTimeline(rows, hit);
  renderLineage(hit);
  renderDocument(hit);
}

function refresh() {
  openDecision(slugFromHash() || selectedSlug, { clearStack: false, writeHash: false });
}

["search", "month-filter", "number-filter"].forEach(id => {
  document.getElementById(id).addEventListener("input", refresh);
  document.getElementById(id).addEventListener("change", refresh);
});
document.querySelectorAll(".chip").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(el => el.classList.toggle("on", el === btn));
  refresh();
}));
window.addEventListener("hashchange", () => {
  if (suppressHashClear) {
    suppressHashClear = false;
    openDecision(slugFromHash(), { clearStack: false, writeHash: false });
    return;
  }
  openDecision(slugFromHash(), { clearStack: true, writeHash: false });
});
openDecision(slugFromHash(), { clearStack: true, writeHash: false });
</script>
</body>
